name: Release

on:
  # Dispatched by the auto-release workflow (red-release.yml) after it tags a version.
  # No `push: tags` trigger — that double-fired the whole matrix (tag push + dispatch)
  # and piled up concurrent runs.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build, e.g. v0.1.0 (must already exist)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # RedDB sidecar pinned for reproducible builds — bump when adopting a newer reddb.
  # v1.18.0 keeps the v1.15+ multi-model MVCC history required for native VCS
  # (request history / time-travel / restore), plus the current RedDB release
  # line used by red-ui compatibility work. Keeps the static (musl)
  # `red-linux-<arch>-static` assets fetch-reddb.mjs prefers (the dynamic `red-linux-x86_64`
  # links the build host's glibc and crash-loops on older distros, "GLIBC_2.39 not found",
  # → black/loading screen). Also persists collection contracts so KV collections survive a
  # server restart (reddb fix a8139467).
  # v1.19.0: native VCS is fully exposed through RQL (CHECKPOINT / red.commits /
  # red.diff / RESET); the HTTP /repo/* transport was retired, so the app's VCS
  # client requires this sidecar — do not pin below v1.19.0.
  # v1.23.1 (current pin): verified compatible against every surface the app
  # touches — HTTP REST (POST /collections/*/documents, PATCH/DELETE
  # /collections/*/entities/*), document `/body/*` set-patches, PUT/GET CONFIG
  # (KV), red.commits (hash/author_name/height/parents), CHECKPOINT ... AUTHOR,
  # ALTER TABLE SET VERSIONED, and AS OF COMMIT time-travel. No on-disk format
  # change since 1.4.0 (16KB pages), so 1.19 stores open unchanged. The 1.21/1.22
  # document-DML RQL breaking changes don't apply (writes go through the REST
  # endpoints, not hand-built VALUES literals). RESET HARD stays unimplemented
  # (Phase 4) exactly as it already was at 1.19.0 — not a regression. 1.23 adds
  # disk-resident H3 geo indexing plus a hot-path perf sweep.
  REDDB_VERSION: v1.23.1
  # Empty means release builds download RedDB's prebuilt `red-*` assets through
  # scripts/fetch-reddb.mjs. Set only for emergency validation against an
  # unpublished RedDB commit; source builds make Linux/Windows release legs slow.
  REDDB_SOURCE_REF: ""
  # Run AppImage tooling (linuxdeploy) without FUSE, which CI runners lack.
  APPIMAGE_EXTRACT_AND_RUN: "1"
  # linuxdeploy's strip pass chokes on some shared objects under the no-FUSE extract path
  # and aborts the whole AppImage bundle ("failed to run linuxdeploy"); skip it.
  NO_STRIP: "1"

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check RedDB sidecar source/release availability
        # With REDDB_SOURCE_REF set, verify the pinned RedDB commit exists; otherwise
        # verify the pinned release exposes the prebuilt sidecar assets for every
        # platform we build below. Keep this list in sync with the build matrix —
        # every target that ships must have a `red` sidecar to embed.
        # Windows on ARM is absent on purpose: RedDB publishes no
        # `red-windows-aarch64.exe`, and Windows 11 ARM64 runs the x64 build
        # under emulation, so arm64 hosts install the x86_64 setup.
        run: >-
          node scripts/check-reddb-release-assets.mjs
          x86_64-unknown-linux-gnu
          aarch64-unknown-linux-gnu
          aarch64-apple-darwin
          x86_64-apple-darwin
          x86_64-pc-windows-msvc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    # `optional` legs are best-effort: they still run and still upload, but their failure
    # must not fail the `build` job, because every downstream job `needs: build` and would
    # be skipped — costing the whole release its checksums.txt and notes over one
    # unproven platform. verify-assets downgrades a missing optional asset to a warning.
    # Promote a leg to required (drop `optional`) once it has gone green in a real release.
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `bundle` is the directory Tauri writes bundles into. It gains a <triple>
          # segment whenever `--target` is passed, which the cross-compiled leg does.
          #
          # Linux ships BOTH the AppImage (single-file, `install.sh --appimage`) and the .deb
          # (apt crowd). AppImage tooling runs without FUSE via APPIMAGE_EXTRACT_AND_RUN.
          - {
              os: ubuntu-22.04,
              target: x86_64-unknown-linux-gnu,
              label: linux-x86_64,
              args: "--bundles deb,appimage",
              bundle: target/release/bundle,
              osname: linux,
              arch: x86_64,
            }
          - {
              os: ubuntu-22.04-arm,
              target: aarch64-unknown-linux-gnu,
              label: linux-aarch64,
              args: "--bundles deb,appimage",
              bundle: target/release/bundle,
              osname: linux,
              arch: aarch64,
            }
          # macOS: Apple Silicon .dmg natively on macos-14, plus an Intel .dmg
          # cross-compiled on the same arm runner. GitHub's Intel macos-13 runners are
          # scarce enough that a native leg sat queued forever, and the Apple SDK is
          # universal, so `--target x86_64-apple-darwin` from arm is the way to keep
          # Intel Macs covered. The `red` sidecar (red-macos-x86_64) and the Bun engine
          # (--target=bun-darwin-x64) are both fetched/built for x86_64 to match.
          - {
              os: macos-14,
              target: aarch64-apple-darwin,
              label: macos-aarch64,
              args: "--bundles dmg",
              bundle: target/release/bundle,
              osname: darwin,
              arch: aarch64,
            }
          # `optional` until it has shipped green once: this cross-compile has never run in
          # CI, and a first-run failure would otherwise skip checksums for the whole release.
          - {
              os: macos-14,
              target: x86_64-apple-darwin,
              label: macos-x86_64,
              args: "--target x86_64-apple-darwin --bundles dmg",
              bundle: target/x86_64-apple-darwin/release/bundle,
              osname: darwin,
              arch: x86_64,
              optional: true,
            }
          # Windows: NSIS setup .exe. No arm64 leg — RedDB publishes no
          # `red-windows-aarch64.exe` sidecar to embed, and Windows 11 on ARM runs this
          # x64 build under emulation (install.ps1 falls back to it on arm64 hosts).
          - {
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              label: windows-x86_64,
              args: "--bundles nsis",
              bundle: target/release/bundle,
              osname: windows,
              arch: x86_64,
            }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev \
            clang mold xdg-utils
          # xdg-utils provides xdg-mime, which the AppImage bundler shells out to. It's
          # preinstalled on the x86_64 runner image but NOT on ubuntu-*-arm, so the
          # aarch64 AppImage leg failed "xdg-mime binary not found" without it.
          # FUSE2 runtime so linuxdeploy/AppImage can run (24.04 renamed libfuse2 → libfuse2t64).
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
          # src-tauri/.cargo/config.toml pins -fuse-ld=mold for Linux links.

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The step above installs the target on `stable`, but the app does NOT build with
      # stable: apps/desktop/src-tauri/rust-toolchain.toml pins channel 1.95.0, and rustup's
      # directory override wins inside that directory. So the cross-compiled leg failed with
      # "Target x86_64-apple-darwin is not installed (installed targets: aarch64-apple-darwin)"
      # — that list is 1.95.0's, not stable's. Native legs never noticed, because a
      # toolchain always has its own host target. Add the target to the toolchain that
      # actually builds, by running rustup where the override applies.
      - name: Add the Rust target to the pinned toolchain
        working-directory: apps/desktop/src-tauri
        run: rustup target add ${{ matrix.target }}

      - name: Set up protoc for RedDB source build
        if: env.REDDB_SOURCE_REF != ''
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout RedDB source
        if: env.REDDB_SOURCE_REF != ''
        uses: actions/checkout@v7
        with:
          repository: reddb-io/reddb
          ref: ${{ env.REDDB_SOURCE_REF }}
          path: .red/tmp/reddb-source
          persist-credentials: false

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            .red/tmp/reddb-source -> target

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Brand sync
        run: pnpm brand:sync

      - name: Brand icons (regenerate from brand.iconPath, if set)
        run: pnpm brand:icons

      - name: Build core (UI/engine contract)
        run: pnpm --filter @reddb-io/request-core build

      # ENGINE_TARGET / REDDB_TARGET equal the host triple on every native leg, so this is
      # a no-op there; on the cross-compiled macOS Intel leg they're what make the engine
      # and `red` sidecars come out x86_64 instead of the arm runner's own arch.
      - name: Build engine sidecar (Bun → externalBin)
        run: pnpm engine:build
        env:
          ENGINE_TARGET: ${{ matrix.target }}

      # Build `red` from a pinned RedDB source commit when REDDB_SOURCE_REF is set.
      # This is how red-request can adopt urgent RedDB runtime fixes before the
      # upstream project has published full multi-platform sidecar assets.
      - name: Provision RedDB sidecar (source)
        if: env.REDDB_SOURCE_REF != ''
        run: pnpm reddb:sync
        env:
          REDDB_SRC: ${{ github.workspace }}/.red/tmp/reddb-source
          REDDB_TARGET: ${{ matrix.target }}

      # Otherwise download the prebuilt `red` sidecar for this runner's host
      # triple from RedDB's releases.
      - name: Provision RedDB sidecar (download)
        if: env.REDDB_SOURCE_REF == ''
        run: pnpm reddb:fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDB_TARGET: ${{ matrix.target }}

      # linuxdeploy runs `ldd` on every bundled ELF, including the externalBin sidecars
      # (`red` from reddb, `red-request-engine` from Bun --compile). Those are effectively
      # static/packed, so `ldd` exits 1 ("not a dynamic executable") and linuxdeploy aborts
      # the whole AppImage ("Failed to run ldd: exited with code 1"). Shim ldd to print real
      # output but never fail, so the sidecars are bundled as-is and the AppImage completes.
      - name: Make ldd tolerant of static sidecars (AppImage)
        if: runner.os == 'Linux'
        run: |
          shim="$HOME/.ldd-shim"
          mkdir -p "$shim"
          cat > "$shim/ldd" <<'SH'
          #!/usr/bin/env bash
          /usr/bin/ldd "$@"; exit 0
          SH
          chmod +x "$shim/ldd"
          echo "$shim" >> "$GITHUB_PATH"

      - name: Build + publish bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Red Request ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Release packaging is in progress. Final release notes, verification commands,
            checksums, and asset details are published by the checksums job after every
            platform build has uploaded its installer assets.
          releaseDraft: false
          prerelease: false

      - name: Verify AppImage RedDB sidecar resource
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(ls apps/desktop/src-tauri/${{ matrix.bundle }}/appimage/*.AppImage | head -1)"
          node scripts/check-appimage-reddb-sidecar.mjs "$appimage" "$REDDB_VERSION"

      # Re-publish each platform's single-file bundle under a stable, version-free name so
      # install.sh can fetch `…/releases/latest/download/red-request-<os>-<arch>.<ext>` without
      # parsing the API. Best-effort per file: a missing bundle warns, never fails the release.
      - name: Stage portable assets
        shell: bash
        run: |
          set -uo pipefail
          BR="apps/desktop/src-tauri/${{ matrix.bundle }}"
          OUT="${RUNNER_TEMP}/portable"; mkdir -p "$OUT"
          stage() { # glob dest
            local f; f="$(ls $1 2>/dev/null | head -1 || true)"
            if [[ -n "$f" ]]; then cp "$f" "$OUT/$2"; echo "staged $2  ← $(basename "$f")"
            else echo "::warning::no bundle matched $1"; fi
          }
          case "${{ runner.os }}" in
            Linux)
              stage "$BR/appimage/*.AppImage" "red-request-linux-${{ matrix.arch }}.AppImage"
              stage "$BR/deb/*.deb"           "red-request-linux-${{ matrix.arch }}.deb" ;;
            macOS)
              stage "$BR/dmg/*.dmg"           "red-request-darwin-${{ matrix.arch }}.dmg" ;;
            Windows)
              stage "$BR/nsis/*-setup.exe"    "red-request-windows-${{ matrix.arch }}-setup.exe" ;;
          esac
          ls -la "$OUT"

      - name: Upload portable assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          shopt -s nullglob
          files=("${RUNNER_TEMP}/portable"/*)
          [[ ${#files[@]} -gt 0 ]] || { echo "nothing to upload"; exit 0; }
          gh release upload "$TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"

  # Gate between build and publish: every asset the installers resolve BY NAME must
  # actually be on the release. The staging step is best-effort per file (a missing bundle
  # only warns), and `continue-on-error` lets an optional leg fail — which together is
  # exactly how a release ships without the .exe install.ps1 asks for. Fail here instead.
  verify-assets:
    name: verify assets
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Check the asset manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          work="$(mktemp -d)"; cd "$work"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'red-request-*' --skip-existing

          # Names install.sh and install.ps1 build from $OS/$ARCH — see asset_name() /
          # Get-AssetName. Keep these two lists in sync with the build matrix.
          REQUIRED=(
            red-request-linux-x86_64.deb
            red-request-linux-x86_64.AppImage
            red-request-linux-aarch64.deb
            red-request-linux-aarch64.AppImage
            red-request-darwin-aarch64.dmg
            red-request-windows-x86_64-setup.exe
          )
          # Best-effort legs (matrix `optional: true`); the installers degrade to a clear
          # message when these are absent, so warn rather than block the release.
          OPTIONAL=(
            red-request-darwin-x86_64.dmg
          )

          status=0
          check() { # asset level
            local asset="$1" level="$2"
            if [[ ! -f "$asset" ]]; then
              if [[ "$level" == required ]]; then
                echo "::error::missing required asset ${asset} — its build leg failed or staged nothing"
                status=1
              else
                echo "::warning::missing optional asset ${asset} — its build leg failed"
              fi
              return
            fi
            if [[ ! -s "$asset" ]]; then
              echo "::error::${asset} is empty"; status=1; return
            fi
            echo "ok  ${asset}  ($(stat -c%s "$asset") bytes)"
          }

          for a in "${REQUIRED[@]}"; do check "$a" required; done
          for a in "${OPTIONAL[@]}"; do check "$a" optional; done
          exit "$status"

  # One checksums.txt covering every staged single-file asset, after all builds land.
  checksums:
    name: checksums
    needs: verify-assets
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Generate + publish checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          work="$(mktemp -d)"; cd "$work"
          # Only the stable, version-free assets staged by the build jobs (tauri's native
          # names use `red-request_<ver>_…`, so the `red-request-*` glob skips them).
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'red-request-*' --skip-existing
          shopt -s nullglob
          assets=(red-request-*)
          [[ ${#assets[@]} -gt 0 ]] || { echo "no portable assets to checksum"; exit 0; }
          sha256sum "${assets[@]}" > checksums.txt
          cp checksums.txt SHA256SUMS
          {
            echo "| Asset | Size |"
            echo "| --- | ---: |"
            for asset in "${assets[@]}"; do
              bytes="$(wc -c < "$asset" | tr -d ' ')"
              echo "| \`$asset\` | $bytes bytes |"
            done
          } > artifact-sizes.md
          echo "── checksums.txt ──"; cat checksums.txt
          echo "── artifact-sizes.md ──"; cat artifact-sizes.md
          gh release upload "$TAG" checksums.txt SHA256SUMS artifact-sizes.md --clobber -R "$GITHUB_REPOSITORY"
          cd "$GITHUB_WORKSPACE"
          node scripts/generate-release-notes.mjs "$TAG" > "$work/release-notes.md"
          gh release edit "$TAG" --notes-file "$work/release-notes.md" -R "$GITHUB_REPOSITORY"
